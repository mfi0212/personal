<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            font-size: 14px;
            line-height: 1.4;
            color: oklch(0.18 0.02 60);
            background: oklch(0.985 0.002 90);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            -webkit-user-select: none;
            user-select: none;
        }

        .tool {
            width: 100%;
            max-width: 420px;
            border: 2px solid oklch(0.82 0.015 80);
            background: oklch(0.98 0.005 90);
        }

        .tool-bar {
            display: flex;
            align-items: center;
            min-height: 48px;
            border-bottom: 2px solid oklch(0.82 0.015 80);
            padding: 0 16px;
            background: oklch(0.86 0.18 89.43);
            justify-content: center;
        }

        .tool-bar h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: oklch(0.18 0.04 80);
        }

        .section {
            padding: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .field label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: oklch(0.45 0.02 60);
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .field input {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            color: oklch(0.18 0.02 60);
            background: oklch(0.985 0.002 90);
            border: 1px solid oklch(0.82 0.015 80);
            border-radius: 0;
            outline: none;
        }

        .field input:focus {
            border-color: oklch(0.86 0.18 89.43);
            box-shadow: inset 0 0 0 1px oklch(0.86 0.18 89.43);
        }

        .field input::placeholder {
            color: oklch(0.45 0.02 60);
            opacity: 0.7;
        }

        button {
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: oklch(0.18 0.04 80);
            background: oklch(0.86 0.18 89.43);
            border: 1px solid oklch(0.82 0.015 80);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }

        button:hover {
            background: oklch(0.80 0.16 89);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            font-size: 13px;
            color: #c0392b;
            margin-top: -8px;
            margin-bottom: 12px;
            display: none;
        }

        .details {
            display: none;
            border-top: 2px solid oklch(0.82 0.015 80);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid oklch(0.82 0.015 80);
        }

        .detail-row:last-child {
            border-bottom: none;
        }



        .detail-row .value {
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: oklch(0.18 0.02 60);
            text-align: right;
        }

        .detail-row .value.highlight {
            background: oklch(0.86 0.18 89.43);
            color: oklch(0.18 0.04 80);
            padding: 2px 10px;
        }

        footer {
            text-align: center;
            font-size: 12px;
            padding: 16px;
            color: oklch(0.45 0.02 60);
        }
    </style>
</head>
<body>
    <div class="tool">
        <div class="tool-bar">
            <h1>Gold Purchase Lookup</h1>
        </div>

        <div class="section">
            <div class="field">
                <label>Phone Number</label>
                <div class="input-row">
                    <input type="tel" id="phone" placeholder="Enter 10-digit number" maxlength="10" inputmode="numeric">
                    <button id="verifyBtn" onclick="verifyPhone()">Verify</button>
                </div>
            </div>
            <div class="error" id="errorMsg">Please enter a valid 10-digit phone number</div>
        </div>

        <div class="details" id="details">
            <div class="detail-row">
                <span class="label">Name</span>
                <span class="value" id="name">—</span>
            </div>
            <div class="detail-row">
                <span class="label">Amount Spent</span>
                <span class="value highlight" id="amount">—</span>
            </div>
            <div class="detail-row">
                <span class="label">Bought Gold On</span>
                <span class="value" id="date">—</span>
            </div>
            <div class="detail-row">
                <span class="label">Item</span>
                <span class="value" id="item">—</span>
            </div>
            <div class="detail-row">
                <span class="label">No. of grams</span>
                <span class="value" id="qty">—</span>
            </div>
        </div>
    </div>

    <footer>Efiles · All rights reserved <br> Version(v.03.08.10)</footer>

    <script>
        // Demo data (replace with real API later)
        const records = {
            "9493511389": {
                name: "Phani Yerra",
                amount: "₹-",
                date: "-",
                item: "-",
                qty: "-"
            },
            "9948534444": {
                name: "Bhargav Akula",
                amount: "₹-",
                date: "-",
                item: "-",
                qty: "-"
            },
        };

        const phoneInput = document.getElementById('phone');
        const errorMsg = document.getElementById('errorMsg');
        const details = document.getElementById('details');

        phoneInput.addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '').slice(0, 10);
            errorMsg.style.display = 'none';
        });

        function verifyPhone() {
            const phone = phoneInput.value.trim();

            if (!/^\d{10}$/.test(phone)) {
                errorMsg.style.display = 'block';
                details.style.display = 'none';
                return;
            }

            errorMsg.style.display = 'none';

            const data = records[phone];

            if (data) {
                document.getElementById('name').textContent = data.name;
                document.getElementById('amount').textContent = data.amount;
                document.getElementById('date').textContent = data.date;
                document.getElementById('item').textContent = data.item;
                document.getElementById('qty').textContent = data.qty;
                details.style.display = 'block';
            } else {
                document.getElementById('name').textContent = 'Not found';
                document.getElementById('amount').textContent = '—';
                document.getElementById('date').textContent = '—';
                document.getElementById('item').textContent = '—';
                document.getElementById('qty').textContent = '—';
                details.style.display = 'block';
            }
        }

        // Allow Enter key to verify
        phoneInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') verifyPhone();
        });
    </script>
</body>
</html>
