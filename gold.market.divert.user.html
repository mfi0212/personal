<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>బంగారం / వెండి market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
* {
	-webkit-tap-highlight-color: transparent;
	margin: 0;
	padding: 0;
	 font-family: 'Inter', system-ui, -apple-system, sans-serif;
}* {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        :root {
            --background: oklch(0.985 0.002 90);
            --foreground: oklch(0.18 0.02 60);
            --muted-foreground: oklch(0.45 0.02 60);
            --card: oklch(0.98 0.005 90);
            --muted: oklch(0.86 0.18 89.43);
            --border: oklch(0.82 0.015 80);
            --primary: oklch(0.86 0.18 89.43);          /* warm yellow */
            --primary-foreground: oklch(0.18 0.04 80);
            --ring: oklch(0.86 0.18 89.43);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-size: 14px;
            line-height: 1.4;
            color: var(--foreground);
            background: var(--background);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            gap: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Frame ── */
        .tool {
            width: 100%;
            max-width: 650px;
            border: 2px solid var(--border);
            background: var(--card);
        }

        /* ── Action / title bar ── */
        .tool-bar {
                display: flex;
    align-items: center;
    min-height: 48px;
    border-bottom: 2px solid var(--border);
    padding: 0 16px;
    background: var(--muted);
    text-align: center;
    justify-content: center;
        }

        .tool-bar h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        /* ── Sections ── */
        .section {
            border-bottom: 1px solid var(--border);
        }

        .section:last-child {
            border-bottom: none;
        }

        .section-header {
            padding: 10px 16px 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted-foreground);
        }

        /* ── Link list (flush rows) ── */
        .link-list a {
            display: block;
            padding: 12px 16px;
            color: var(--foreground);
            text-decoration: none;
            border-top: 1px solid var(--border);
            font-size: 14px;
            transition: background 0.1s;
        }

        .link-list a:first-child {
            border-top: none;
        }

        .link-list a:hover {
                background: var(--primary-foreground);
    color: white;
        }

        /* ── Calculator ── */
        .calc-body {
            display: flex;
            flex-direction: column;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .field:last-of-type {
            border-bottom: none;
        }

        .field label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted-foreground);
        }

        .field input {
            width: 100%;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            color: var(--foreground);
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 0;
            outline: none;
        }

        .field input:focus {
            border-color: var(--ring);
            box-shadow: inset 0 0 0 1px var(--ring);
        }

        .field input::placeholder {
            color: var(--muted-foreground);
            opacity: 0.7;
        }

        /* ── Result block ── */
        .result {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
            border-top: 2px solid var(--border);
        }

        .result-cell {
            background: var(--card);
            padding: 14px 16px;
            text-align: center;
        }

        .result-cell .label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted-foreground);
            margin-bottom: 4px;
        }

        .result-cell .value {
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: var(--primary-foreground);
            background: var(--primary);
            display: inline-block;
            padding: 2px 8px;
            min-width: 4.5em;
        }
footer {
    text-align: center;
    font-size: 12px;
    padding: 10px;
}
        .spacer {
            height: 24px;
        }
    </style>
</head>
<body>
<h2>MARKET</h2>
    <div class="tool">
        <div class="tool-bar">
            <h1>బంగారం market</h1>
        </div>
        <div class="section">
            <div class="link-list">
                <a target="_blank" href="https://www.goodreturns.in/gold-rates/vijayawada.html">విజయవాడ</a>
                <a target="_blank" href="https://www.bankbazaar.com/gold/gold-rate-amalapuram.html">అమలాపురం</a>
                <a target="_blank" href="https://www.indiagoldrate.co.in/24k-gold-rate.php?area_id=2724">నరసాపురం</a>
                <a target="_blank" href="https://www.vaibhavjewellers.com/gold-rate-rajahmundry?srsltid=AU7gw4Why8fVTXLeenOLtxW8DB1eJiiHB1sX4E1tdobzrUROw9bABB3x">రాజమండ్రి</a>
            </div>
        </div>
    </div>

    <div class="spacer"></div>

    <!-- Silver rates -->
    <div class="tool">
        <div class="tool-bar">
            <h1>వెండి market</h1>
        </div>
        <div class="section">
            <div class="link-list">
                <a target="_blank" href="https://www.bankbazaar.com/silver-rate-vijayawada.html">విజయవాడ</a>
                <a target="_blank" href="https://www.bankbazaar.com/silver-rate-amalapuram.html">అమలాపురం</a>
                <a target="_blank" href="https://www.indiagoldrate.co.in/silver-rate.php?area_id=4436">నరసాపురం</a>
                <a target="_blank" href="https://www.goodreturns.in/silver-rates/rajahmundry.html">రాజమండ్రి</a>
            </div>
        </div>
    </div>

    <div class="spacer"></div>

    <!-- Difference Calculator -->
    <div class="tool">
        <div class="tool-bar">
            <h1>Difference Calculator</h1>
        </div>
        <div class="calc-body">
            <div class="field">
                <label>Highest Amount </label>
                <input type="number" id="amount1" placeholder="0.00" oninput="calculate()">
            </div>
            <div class="field">
                <label>Lowest Amount </label>
                <input type="number" id="amount2" placeholder="0.00" oninput="calculate()">
            </div>
            <div class="field">
                <label>No. of Months</label>
                <input type="number" id="months" placeholder="0" oninput="calculate()">
            </div>
            <div class="result">
                <div class="result-cell">
                    <span class="label">Difference</span>
                    <span class="value" id="diff">0.00</span>
                </div>
                <div class="result-cell">
                    <span class="label">× Months</span>
                    <span class="value" id="total">0.00</span>
                </div>
            </div>
        </div>
    </div>
<footer>VSL, All right reserved. <br> Version(v.01.23.9)</footer>
    <script>
        function calculate() {
            const a1 = parseFloat(document.getElementById('amount1').value) || 0;
            const a2 = parseFloat(document.getElementById('amount2').value) || 0;
            const months = parseFloat(document.getElementById('months').value) || 0;

            const difference = a1 - a2;
            const total = difference * months;

            document.getElementById('diff').textContent = difference.toFixed(2);
            document.getElementById('total').textContent = total.toFixed(2);
        }
    </script>
</body>
</html>
